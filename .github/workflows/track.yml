name: customs-track-notify

on:
  schedule:
    # Every 10 minutes (UTC; GitHub may delay a few minutes)
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/track.yml"
      - "scripts/**"
      - "app/**"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check Unipass and notify Kakao
        id: notify
        env:
          UNIPASS_API_KEY: ${{ secrets.UNIPASS_API_KEY }}
          TRACK_HBL: ${{ secrets.TRACK_HBL }}
          TRACK_YEAR: ${{ secrets.TRACK_YEAR }}
          TRACK_CJ_INVOICE: ${{ secrets.TRACK_CJ_INVOICE }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          PUBLIC_PAGE_URL: https://ybs8625-cmd.github.io/customs-tracker/
          FIRST_NOTIFY: "0"
          FORCE_NOTIFY: "1"
          STATE_PATH: data/state.json
        run: python scripts/check_and_notify.py

      - name: Commit state if changed
        if: always() && steps.notify.outcome != 'skipped'
        run: |
          if [ -n "$(git status --porcelain data/state.json docs/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json docs/state.json
            git commit -m "chore: update customs track state"
            git push
          else
            echo "No state changes"
          fi
